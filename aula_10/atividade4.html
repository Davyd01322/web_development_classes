<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <script>
        let num1 = 10;
        let num2 = 20;
        let operation = "+";

        switch(operation){
            case "+":
                console.log(num1 + num2);
                break;
            case "-":
                console.log(num1 - num2);
                break;
            case "*":
                console.log(num1 * num2);
                break;
            case "/":
                console.log(num1 / num2);
                break;
            case "%":
                console.log(num1 % num2);
                break;
            default:
                console.log("operação inválida");
                break;
        }
    </script>
</body>
</html>
