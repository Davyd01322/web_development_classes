<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function criarCupom(percentual){
            return (valor) => valor * (1 - percentual/100);
        }

        const cupom10 = criarCupom(10);
        console.log(cupom10(200));
        console.log(cumpom10(80));
    </script>
</body>
</html>
