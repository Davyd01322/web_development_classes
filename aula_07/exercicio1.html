<!DOCTYPE html>
<html>
    <head>
        <style>
            input:focus{
                outline: none;
            }
            input[required]{
                border:2px solid 
            }
            input[type="email"]{
                background-color: rgb(172, 117, 117);
                color:brown;
                font-weight: bold;
            }
            [type="password"]{
                color:darkcyan;
                border: 1px solid rgb(26, 125, 211);
            }
        </style>
    </head>
    <body>
        <input type="text" placeholder=" Digite seu Nome" required id="nome">
        <input type="email" placeholder="Digite seu E-mail" required id="email">
        <input type="password" placeholder="Digite sua Senha" id="senha">
    </body>
    <script></script>
</html>
